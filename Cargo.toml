[workspace]
members = ["crates/*"]
resolver = "3"

[workspace.package]
version = "0.6.0"
edition = "2024"
rust-version = "1.99"
publish = false

[workspace.dependencies]
phplumb-index = { path = "crates/phplumb-index" }
mago-syntax = "=1.59.0"
mago-names = "=1.59.0"
mago-database = "=1.59.0"
mago-allocator = "=1.59.0"
mago-span = "=1.59.0"
lsp-server = "0.10"
lsp-types = "0.97"
rayon = "1.12"
ignore = "0.4"
globset = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1"
url = "2"
anyhow = "1"
libc = "0.2"
mimalloc = { version = "0.1.52", default-features = false }
postcard = { version = "1.1", features = ["use-std"] }
tempfile = "3"
yaml-rust2 = "0.13"
